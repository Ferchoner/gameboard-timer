# Dependabot (SPEC 08): revisa cada lunes las dependencias de npm y las acciones de GitHub.
# Menores y parches van juntos en un PR por ecosistema; cada versión mayor, en su propio PR.
# Los PRs de Dependabot pasan por la misma CI y Fernando decide el merge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # TypeScript 7 (versión nativa) aún no funciona con vue-tsc: el typecheck falla con
    # ERR_PACKAGE_PATH_NOT_EXPORTED. Se queda en 6.x hasta que vue-tsc lo soporte (SPEC 07).
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      npm-menores:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      acciones-menores:
        update-types:
          - minor
          - patch
