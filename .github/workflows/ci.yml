# CI: en cada PR comprueba que la app compila, igual que el deploy, y corre las pruebas.
# Si falla, el PR aparece en rojo antes de fusionarlo a master (que publica).
name: CI

on:
  pull_request:

jobs:
  build:
    name: Build y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18" # misma versión que el deploy (main.yml)

      # npm install y no npm ci: package-lock.json no está sincronizado (ver pendientes)
      - name: Instalar dependencias
        run: npm install

      - name: Build
        run: npm run build
        env:
          NITRO_PRESET: github-pages

      - name: Pruebas unitarias
        run: npm run test:unit

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      # Reutiliza el build anterior: Playwright sirve .output/public bajo /gameboard-timer/
      - name: Pruebas E2E
        run: npm run test:e2e

      - name: Subir reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
